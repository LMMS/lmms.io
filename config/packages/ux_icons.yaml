# Full configuration reference: https://symfony.com/bundles/ux-icons/current/index.html#configuration
ux_icons:

    # Default HTML attributes to add to all icons
    default_icon_attributes:

        # Use current text color to fill the icon
        fill: currentColor

        # Default dimensions; the width follows each icon's aspect ratio, like Font Awesome
        height: '1em'

        # Passing a class to ux_icon() replaces this one, so keep "icon" in it
        class: icon

    # Throw an exception if an icon is not
    ignore_not_found: false


# Icons are committed to assets/icons/ (run `bin/console ux:icons:lock` after using a new one),
# so the Iconify API is never called outside of dev
when@test:
    ux_icons:
        iconify:
            enabled: false

when@prod:
    ux_icons:
        iconify:
            enabled: false
        # Suppress exceptions for missing icons in production
        ignore_not_found: true
