# Serves public/under-maintenance.html with a 503 while a deploy is running
#
# Description:
#
#    deploy.php creates `.maintenance` in the site root just before rsync, and
#    hooks/post_deploy removes it when it finishes, even if a step fails. The
#    forum and wiki aren't part of the deploy and stay up, and so do the
#    images the maintenance page itself uses.
#
# Usage:
#
#    server {
#       root /path/to/lmms.io/public;
#       include path/to/nginx-maintenance.conf;
#    }
#
#    In deploy.php, right before the rsync command:
#
#       $commands[] = sprintf('touch %s.maintenance', TARGET_DIR);
#
#    and '/.maintenance' in the deploy config's EXCLUDE, so rsync keeps it.
#
# To lift it by hand, e.g. after a deploy that died during rsync:
#
#    rm /path/to/lmms.io/.maintenance
#
set $maintenance 0;
if (-f $document_root/../.maintenance) {
	set $maintenance 1;
}
# The page itself too, or the error_page redirect below would 503 again
if ($uri ~ ^/((img|forum|wiki)(/|$)|under-maintenance\.html$)) {
	set $maintenance 0;
}
if ($maintenance) {
	return 503;
}
error_page 503 /under-maintenance.html;
