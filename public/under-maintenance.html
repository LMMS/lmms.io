<!DOCTYPE HTML>

<head>

	<link rel="icon" type="image/png" href="/img/logo_sm.png">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css" integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX" crossorigin="anonymous">

	<style>
		/* Standalone subset of assets/styles/app.css, this page is served while the app is down */
		html, body { height: 100%; }
		body { display: flex; flex-direction: column; padding-top: 50px; font-family: "Noto Sans", sans-serif; }
		.navbar-custom { --bs-navbar-padding-y: 0; background: url("/img/hexagon.png") #10b146; }
		.navbar-brand { padding-block: 14px; color: #fff; font-family: "Orbitron", sans-serif; font-size: 16px; letter-spacing: 1px; line-height: 22px; }

		.logo-sm { position: relative; top: -2px; margin-right: 5px; }
		.error { flex: 1; display: flex; align-items: center; background: url("/img/hexagon.png") 0 -50px, #10b146; color: #fff; font-family: "Titillium Web", sans-serif; }
		.error a { color: #fff; font-weight: bold; text-decoration: none; box-shadow: inset 0 -2px 0 0 #362a84; }
		footer { padding-block: 20px; background: url("/img/hexagon.png") #222522; }
		a.social { color: rgba(255, 255, 255, 0.8); }
		a.social:hover { color: #fff; }
		a.social .fa-inverse { color: #373b37; }

	<nav class="navbar navbar-custom fixed-top">

			<a class="navbar-brand" href="#"><img alt="LMMS Logo" class="logo-sm" height="22" width="22" src="/img/brand-icon.png">LMMS</a>
